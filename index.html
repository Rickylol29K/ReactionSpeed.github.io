<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reaction Grid Game</title>
    <style>
        body {
            text-align: center;
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            transition: background-color 0.5s;
        }
        
        h1 {
            animation: fadeIn 1s ease-in-out;
        }

        #setup, #stats, #leaderboard {
            animation: fadeIn 1s ease-in-out;
            margin-top: 20px;
            padding: 15px;
            background: white;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            margin-left: auto;
            margin-right: auto;
        }

        #game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 20px;
            animation: fadeIn 1s ease-in-out;
        }

        #grid {
            display: grid;
            gap: 8px;
            margin-top: 20px;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease-in-out;
        }

        .tile {
            width: 60px;
            height: 60px;
            background-color: white;
            border: 2px solid black;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.2s ease;
            border-radius: 8px;
        }

        .tile:hover {
            transform: scale(1.1);
        }

        .active {
            background-color: orange;
            animation: flash 0.3s ease-in-out;
        }

        button {
            padding: 10px 15px;
            border: none;
            background-color: #007bff;
            color: white;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #0056b3;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes flash {
            0% { background-color: white; }
            50% { background-color: orange; }
            100% { background-color: orange; }
        }

    </style>
</head>
<body>

    <h1>Reaction Grid Game</h1>
    
    <div id="setup">
        <label>Grid Size: <input type="number" id="gridSize" value="4" min="2" max="6"></label>
        <label>Max Time per Click (seconds): <input type="number" id="maxTime" value="2" min="1" max="5"></label>
        <button onclick="startGame()">Start Game</button>
    </div>

    <div id="game-container" style="display: none;">
        <p id="countdown"></p>
        <div id="grid"></div>
        <button onclick="endGame()">Complete</button>
    </div>

    <div id="stats" style="display: none;">
        <h2>Game Statistics</h2>
        <p id="fastest-time"></p>
        <p id="average-time"></p>
        <p id="accuracy"></p>
        <p id="streak">Longest Streak: --</p>
        <button onclick="resetGame()">Play Again</button>
    </div>

    <div id="leaderboard">
        <h2>Leaderboard (Personal Bests)</h2>
        <p id="best-fastest-time">Fastest Time: -- sec</p>
        <p id="best-average-time">Best Average Time: -- sec</p>
        <p id="best-streak">Best Streak: --</p>
    </div>

    <script src="game.js"></script>
</body>
</html>
